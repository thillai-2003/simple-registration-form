<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>User Registration</h1>

    <form id="userForm">

        <div class="form-group">
            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                name="name"
                required
            >
        </div>

        <div class="form-group">
            <label for="age">Age</label>
            <input
                type="number"
                id="age"
                name="age"
                required
            >
        </div>

        <div class="form-group">
            <label for="mobile">Mobile Number</label>
            <input
                type="tel"
                id="mobile"
                name="mobile"
                required
            >
        </div>

        <button type="submit">
            Submit
        </button>

    </form>

    <script src="script.js"></script>

</body>
</html>

<script src="script.js"></script>
