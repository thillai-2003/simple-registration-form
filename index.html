<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Registration</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .form-container {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .form-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .form-header h1 {
            font-size: 28px;
            color: #111827;
            margin-bottom: 8px;
        }

        .form-header p {
            font-size: 14px;
            color: #6b7280;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        input {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
            color: #111827;
            background: #ffffff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        input::placeholder {
            color: #9ca3af;
        }

        button {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:active {
            transform: scale(0.99);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
        }

        .message.success {
            display: block;
            background: #ecfdf5;
            color: #047857;
        }

        .message.error {
            display: block;
            background: #fef2f2;
            color: #b91c1c;
        }
    </style>
</head>

<body>

    <div class="form-container">

        <div class="form-header">
            <h1>User Registration</h1>
            <p>Please enter your details below</p>
        </div>

        <form id="userForm" novalidate>

            <div class="form-group">
                <label for="name">Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    autocomplete="name"
                >
            </div>

            <div class="form-group">
                <label for="age">Age</label>

                <input
                    type="number"
                    id="age"
                    name="age"
                    placeholder="Enter your age"
                    min="1"
                    max="120"
                >
            </div>

            <div class="form-group">
                <label for="mobile">Mobile Number</label>

                <input
                    type="tel"
                    id="mobile"
                    name="mobile"
                    placeholder="Enter 10-digit mobile number"
                    maxlength="10"
                    inputmode="numeric"
                    autocomplete="tel"
                >
            </div>

            <button type="submit" id="submitButton">
                Submit
            </button>

            <div id="message" class="message"></div>

        </form>

    </div>

    <script src="script.js"></script>

</body>
</html>
